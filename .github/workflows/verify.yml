name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --retry, and a check that the download is actually a zip.
      #
      # This fetch fails transiently often enough to matter: it took out four
      # PRs in one afternoon during the round-6 merge, and it does it in under
      # ten seconds with `unzip: cannot find zipfile directory`, which reads
      # like a corrupt release artifact rather than a network blip. Every one of
      # those cost somebody a diff review before they thought to look at the log.
      #
      # `unzip -t` fails loudly on a truncated or HTML-error-page download, so a
      # bad fetch says so here rather than three steps later as a missing tool.
      - name: Install the Luau toolchain
        run: |
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --fail \
            -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -tq /tmp/luau.zip
          unzip -q /tmp/luau.zip -d "$HOME/.luau"
          chmod +x "$HOME"/.luau/*
          echo "$HOME/.luau" >> "$GITHUB_PATH"

      # syntax, static analysis, style ownership, 1700+ config assertions, and
      # the economy
      # simulation (fails on an unbuyable first dropper, a >15min mid-game
      # wall, or a total build outside 45-150 minutes)
      - name: Verify
        run: python3 tools/verify.py

      # verify.py regenerates build/ as its last step, so a diff here means
      # someone edited src/ without re-running tools/pack.py
      - name: Packed build is up to date
        run: |
          if ! git diff --quiet -- build/; then
            echo "::error::build/ is stale. Run 'python3 tools/pack.py' and commit the result."
            git diff --stat -- build/
            exit 1
          fi
